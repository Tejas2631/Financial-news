<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market News Desk</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf2;--panel:#f7f9fb;--ink:#13203a;--mute:#5d6b82;--line:#cdd5e0;--up:#0b7a5a;--down:#b3261e;--flat:#7a8699;--link:#2447c9;--sel:#13203a;--selink:#f7f9fb;--hl:#e3efe9;--hi:#9a5b00;--hibg:#fdf0d8}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--panel:#162033;--ink:#e6ebf4;--mute:#93a1ba;--line:#2a3750;--up:#3ec79a;--down:#ff7b72;--flat:#8391a9;--link:#8fa8ff;--sel:#e6ebf4;--selink:#0f1624;--hl:#1b3a33;--hi:#f2b24c;--hibg:#3a2c10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font:600 22px/1 "IBM Plex Sans Condensed",sans-serif;margin:0}
.top input[type=search]{flex:1;min-width:160px;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.live{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--down)}
.live.on .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in srgb,var(--up) 25%,transparent)}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;cursor:pointer}
.btn,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px}
.btn.primary{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.btn[aria-pressed=true]{background:var(--up);color:#fff;border-color:var(--up)}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:20px 24px}
aside h2{font:600 14px/1 "IBM Plex Sans Condensed",sans-serif;margin:20px 0 8px;color:var(--mute)}
aside h2:first-child{margin-top:0}
.chips{display:flex;flex-direction:column;gap:2px}
.chip{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;color:var(--ink);padding:5px 8px;border-radius:5px}
.chip span{color:var(--mute);font-size:12px}
.chip:hover{background:var(--line)}
.chip[aria-pressed=true]{background:var(--sel);color:var(--selink)}
.chip[aria-pressed=true] span{color:inherit;opacity:.7}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;color:var(--mute);font-size:13px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;margin-right:-1px}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selink);border-color:var(--sel)}
.feed{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.story{display:grid;grid-template-columns:4px 1fr;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);transition:background 3s}
.story:last-child{border-bottom:0}
.story.fresh{background:var(--hl);transition:none}
.sig{border-radius:2px;background:var(--flat)}
.bullish .sig{background:var(--up)}.bearish .sig{background:var(--down)}
.meta{color:var(--mute);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{font-size:11.5px;font-weight:500;padding:0 7px;border-radius:9px;color:#fff;background:var(--up)}
.badge.update{background:var(--link)}
.story h3{margin:2px 0 4px;font:500 17px/1.35 "IBM Plex Sans",sans-serif;max-width:75ch}
.story h3 a{text-decoration:none}.story h3 a:hover{text-decoration:underline;color:var(--link)}
.story p{margin:0 0 8px;color:var(--mute);max-width:75ch;font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:10px}
.tag.co{font-weight:500}
.empty,.err{padding:40px 16px;text-align:center;color:var(--mute)}
.err{color:var(--down)}
.badge.hi{background:var(--hi);color:#fff}
@media(prefers-color-scheme:dark){.badge.hi{color:#1a1204}}
.badge.med{background:none;color:var(--hi);box-shadow:inset 0 0 0 1px var(--hi)}
.badge.wl{background:var(--hibg);color:var(--hi);box-shadow:inset 0 0 0 1px var(--hi)}
.story.high{background:linear-gradient(90deg,var(--hibg),transparent 40%)}
.btn.small{padding:3px 10px;font-size:13px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(520px,92vw);padding:20px}
dialog::backdrop{background:rgba(10,16,28,.55)}
dialog h2{margin:0 0 4px;font:600 18px "IBM Plex Sans Condensed",sans-serif}
dialog p{margin:0 0 12px;color:var(--mute);font-size:13.5px}
.wl-list{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;min-height:30px}
.wl-list .af{border-color:var(--hi)}
.wl-add{display:flex;gap:8px}
.wl-add input{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.wl-msg{min-height:20px;margin:8px 0 0;color:var(--down);font-size:13px}
.more{display:block;margin:14px auto}.more[hidden]{display:none}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.active:empty{display:none}
.af{border:1px solid var(--sel);background:none;color:var(--ink);padding:2px 10px;border-radius:12px;font-size:13px}.af:hover{background:var(--line)}.af.clear{border-color:var(--down);color:var(--down)}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:12px}aside{order:2}.top{padding:12px}.tools{margin-left:0}}
@media(prefers-reduced-motion:reduce){.story{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Market News Desk</h1>
  <div class="live" id="live"><i class="dot"></i><span id="livetxt">Connecting…</span></div>
  <input id="q" type="search" placeholder="Search headlines, companies, tickers" aria-label="Search news">
  <div class="tools">
    <button class="btn" id="wlbtn">★ Watchlist</button>
    <button class="btn" id="alerts" aria-pressed="false">Desktop alerts: off</button>
    <select id="range" aria-label="CSV time range">
      <option value="1">Last 1 hour</option><option value="6">Last 6 hours</option>
      <option value="24" selected>Last 24 hours</option><option value="168">Last 7 days</option><option value="336">Last 14 days</option>
    </select>
    <button class="btn primary" id="csv">Download CSV</button>
    <button class="btn" id="refresh">Refresh feeds</button>
  </div>
</header>
<div class="wrap">
  <aside id="filters" aria-label="Filters"></aside>
  <main>
    <div class="bar">
      <span id="count"></span>
      <div class="seg" role="group" aria-label="Time range" id="hours"></div>
      <div class="seg" role="group" aria-label="Sentiment" id="sent"></div>
      <div class="seg" role="group" aria-label="Priority" id="prio"></div>
      <div class="seg" role="group" aria-label="Sort order" id="sort"></div>
      <span id="srcinfo"></span>
    </div>
    <div class="active" id="active"></div>
    <ul class="feed" id="feed"></ul>
    <button class="btn more" id="more" hidden>Load more stories</button>
  </main>
</div>
<dialog id="wldlg" aria-labelledby="wlt">
  <h2 id="wlt">Your watchlist</h2>
  <p>Stories that mention these companies get a priority boost, a ★ badge, and can be the only ones sent to Telegram.</p>
  <div class="wl-list" id="wllist"></div>
  <form class="wl-add" id="wlform">
    <input id="wlname" list="wlopts" placeholder="Add a company, e.g. Infosys" autocomplete="off" aria-label="Company to add">
    <datalist id="wlopts"></datalist>
    <button class="btn primary" type="submit">Add</button>
    <button class="btn" type="button" id="wlclose">Done</button>
  </form>
  <div class="wl-msg" id="wlmsg" role="status"></div>
</dialog>
<script>
const API = (window.NEWS_API || "") + "/api";
const S = {sector:"",trend:"",company:"",source:"",sentiment:"",hours:"",q:"",min_priority:"",watchlist:"",sort:"",offset:0,limit:40};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let total = 0, alertsOn = false;

function ago(ts){
  const s = Math.max(0, Date.now()/1000 - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago";
  return new Date(ts*1000).toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
setInterval(() => document.querySelectorAll(".t").forEach(e => e.textContent = ago(+e.dataset.ts)), 30000);

function card(a, flag){
  const tags = [...a.companies.map(t => ["co",t]), ...a.sectors.map(t => ["",t]), ...a.trends.map(t => ["",t])]
    .map(([c,t]) => `<span class="tag ${c}">${esc(t)}</span>`).join("");
  const p = a.priority || {};
  const badge = (flag ? `<span class="badge ${flag}">${flag === "update" ? "Updated" : "New"}</span>` : "")
    + (p.level === "high" ? `<span class="badge hi" title="Priority score ${p.score}">High priority</span>`
      : p.level === "medium" ? `<span class="badge med" title="Priority score ${p.score}">Medium</span>` : "")
    + (p.watch ? `<span class="badge wl" title="Mentions a company on your watchlist">★ Watchlist</span>` : "");
  const also = a.also_reported_by.length ? `<span>also on ${esc(a.also_reported_by.join(", "))}</span>` : "";
  return `<li class="story ${a.sentiment} ${p.level || ""}${flag ? " fresh" : ""}" data-id="${a.id}"><i class="sig" title="${a.sentiment}"></i><div>
    <div class="meta">${badge}<span>${esc(a.source)}</span><span class="t" data-ts="${a.published}">${ago(a.published)}</span>${also}</div>
    <h3><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h3>
    ${a.summary ? `<p>${esc(a.summary)}</p>` : ""}<div class="tags">${tags}</div></div></li>`;
}

function seg(el, opts, key){
  el.innerHTML = opts.map(([l,v]) => `<button aria-pressed="${S[key]==v}" data-v="${v}">${l}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if(!b) return; S[key] = b.dataset.v; seg(el,opts,key); load(true); };
}
const HOURS = [["All",""],["1h","1"],["6h","6"],["24h","24"]], SENT = [["Any",""],["Bullish","bullish"],["Bearish","bearish"]];
const PRIO = [["Any priority",""],["High","high"],["Medium+","medium"],["★ Watchlist","1"]], SORT = [["Newest","" ],["Top priority","priority"]];
// the Priority control sets two things: min_priority (high / medium) or watchlist-only
const prioVal = () => S.watchlist ? "1" : S.min_priority;
function segPrio(){
  const el = $("prio");
  el.innerHTML = PRIO.map(([l,v]) => `<button aria-pressed="${prioVal()==v}" data-v="${v}">${l}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if(!b) return;
    S.watchlist = b.dataset.v === "1" ? "1" : ""; S.min_priority = b.dataset.v === "1" ? "" : b.dataset.v;
    segPrio(); load(true); };
}
seg($("hours"), HOURS, "hours"); seg($("sent"), SENT, "sentiment"); seg($("sort"), SORT, "sort"); segPrio();
const LABEL = {q:"Search", sector:"Sector", trend:"Trend", company:"Company", source:"Source", sentiment:"Sentiment", hours:"Time", min_priority:"Priority", watchlist:"Watchlist only"};
const shown = k => k === "hours" ? S[k] + "h" : k === "min_priority" ? (S[k] === "high" ? "high" : "medium and up") : k === "watchlist" ? "on" : S[k];
function renderActive(){
  const on = Object.keys(LABEL).filter(k => S[k]);
  $("active").innerHTML = on.length ? on.map(k => `<button class="af" data-k="${k}" title="Remove this filter">${LABEL[k]}: ${esc(shown(k))} ×</button>`).join("")
    + `<button class="af clear" data-k="*">Clear all filters</button>` : "";
}
function syncUI(){
  seg($("hours"), HOURS, "hours"); seg($("sent"), SENT, "sentiment"); segPrio();
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", S[x.dataset.k] === x.dataset.v));
  $("q").value = S.q; renderActive();
}
$("active").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k === "*") for (const k of Object.keys(LABEL)) S[k] = ""; else S[b.dataset.k] = "";
  syncUI(); load(true);
};

function group(title, key, data){
  const entries = Object.entries(data || {});
  if (!entries.length) return "";
  return `<h2>${title}</h2><div class="chips">` + entries.map(([n,c]) =>
    `<button class="chip" aria-pressed="${S[key]===n}" data-k="${key}" data-v="${esc(n)}">${esc(n)}<span>${c}</span></button>`).join("") + `</div>`;
}
async function loadMeta(){
  try{
    const m = await (await fetch(API + "/meta")).json();
    const srcs = Object.fromEntries(m.sources.filter(s => s.last_ok).map(s => [s.name, s.total]));
    $("filters").innerHTML = group("Sectors (last 3 days)","sector",m.sectors) + group("Market trends","trend",m.trends)
      + group("Companies","company",m.companies) + group("Sources","source",srcs);
    $("srcinfo").textContent = `${m.sources.filter(s => s.last_ok).length} of ${m.sources.length} sources live`;
  }catch(e){}
}
$("filters").onclick = e => {
  const b = e.target.closest(".chip"); if(!b) return;
  const {k,v} = b.dataset; S[k] = S[k] === v ? "" : v;
  document.querySelectorAll(`.chip[data-k="${k}"]`).forEach(x => x.setAttribute("aria-pressed", x.dataset.v === S[k]));
  load(true);
};

function params(extra){
  const p = new URLSearchParams();
  for (const k of ["sector","trend","company","source","sentiment","hours","q","min_priority","watchlist","sort"]) if (S[k]) p.set(k, S[k]);
  for (const k in extra) p.set(k, extra[k]);
  return p;
}
async function load(reset){
  if (reset) S.offset = 0;
  renderActive();
  try {
    const r = await fetch(API + "/news?" + params({limit:S.limit, offset:S.offset})); if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    const html = d.items.map(a => card(a)).join("");
    if (reset) $("feed").innerHTML = html || `<li class="empty">No stories match all of the filters above. Remove one (click it), or use Clear all filters.</li>`;
    else $("feed").insertAdjacentHTML("beforeend", html);
    total = d.total; $("count").textContent = `${total} stories`;
    $("more").hidden = S.offset + d.items.length >= d.total;
  } catch (e) {
    if (reset) $("feed").innerHTML = `<li class="err">Can't reach the news service. Check that the server is running; retrying automatically.</li>`;
  }
}

// ---- live updates
function matches(a){
  return (!S.sector || a.sectors.includes(S.sector)) && (!S.trend || a.trends.includes(S.trend))
    && (!S.company || a.companies.includes(S.company)) && (!S.source || a.source === S.source)
    && (!S.sentiment || a.sentiment === S.sentiment)
    && (!S.watchlist || (a.priority && a.priority.watch))
    && (!S.min_priority || (a.priority && (a.priority.level === "high" || (S.min_priority === "medium" && a.priority.level === "medium"))))
    && (!S.q || (a.title + " " + a.summary + " " + a.companies.join(" ")).toLowerCase().includes(S.q.toLowerCase()));
}
let metaTimer;
function onLive(kind, a){
  if (alertsOn && Notification.permission === "granted")
    new Notification((kind === "update" ? "Updated: " : "New: ") + a.source, {body: a.title});
  clearTimeout(metaTimer); metaTimer = setTimeout(loadMeta, 3000);
  if (!matches(a)) return;
  if (S.sort === "priority") { clearTimeout(onLive.t); onLive.t = setTimeout(() => load(true), 1500); return; }  // keep ranking order
  const old = document.querySelector(`[data-id="${a.id}"]`);
  if (old) old.remove(); else { total++; $("count").textContent = `${total} stories`; }
  const empty = document.querySelector(".empty"); if (empty) empty.remove();
  $("feed").insertAdjacentHTML("afterbegin", card(a, kind));
  const li = $("feed").firstElementChild; setTimeout(() => li.classList.remove("fresh"), 50);
}
function connect(){
  const es = new EventSource(API + "/stream");
  const set = on => { $("live").classList.toggle("on", on); $("livetxt").textContent = on ? "Live" : "Reconnecting…"; };
  es.onopen = () => set(true); es.onerror = () => set(false);
  for (const k of ["new","update"]) es.addEventListener(k, e => onLive(k, JSON.parse(e.data)));
}

// ---- controls
$("csv").onclick = () => { location.href = API + "/export?" + params({format:"csv", hours:$("range").value, limit:5000}); };
$("refresh").onclick = async () => { await fetch(API + "/refresh", {method:"POST"}); setTimeout(loadMeta, 4000); };
$("more").onclick = () => { S.offset += S.limit; load(false); };
let t; $("q").oninput = e => { clearTimeout(t); t = setTimeout(() => { S.q = e.target.value.trim(); load(true); }, 300); };
$("alerts").onclick = async () => {
  if (!("Notification" in window)) return alert("This browser does not support desktop notifications.");
  if (!alertsOn && Notification.permission !== "granted") await Notification.requestPermission();
  alertsOn = !alertsOn && Notification.permission === "granted";
  $("alerts").setAttribute("aria-pressed", alertsOn); $("alerts").textContent = "Desktop alerts: " + (alertsOn ? "on" : "off");
};

// ---- watchlist editor
let WL = [];
const wlMsg = t => $("wlmsg").textContent = t || "";
function drawWL(){
  $("wllist").innerHTML = WL.length ? WL.map(n => `<button class="af" data-n="${esc(n)}" title="Remove ${esc(n)}">★ ${esc(n)} ×</button>`).join("")
    : `<span style="color:var(--mute)">Nothing yet. Add your first company below.</span>`;
  $("wlbtn").textContent = `★ Watchlist (${WL.length})`;
}
async function loadWL(){
  try { WL = (await (await fetch(API + "/watchlist")).json()).companies; drawWL(); } catch(e){}
  try { const c = (await (await fetch(API + "/companies")).json()).companies;
        $("wlopts").innerHTML = c.map(n => `<option value="${esc(n)}">`).join(""); } catch(e){}
}
async function saveWL(list){
  const r = await fetch(API + "/watchlist", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({companies:list})});
  if (!r.ok) { const d = await r.json().catch(() => ({})); wlMsg(d.detail || "Could not save the watchlist."); return false; }
  WL = (await r.json()).companies; drawWL(); wlMsg(""); load(true); loadMeta(); return true;
}
$("wlbtn").onclick = () => { wlMsg(""); $("wldlg").showModal(); $("wlname").focus(); };
$("wlclose").onclick = () => $("wldlg").close();
$("wllist").onclick = e => { const b = e.target.closest("button"); if (b) saveWL(WL.filter(n => n !== b.dataset.n)); };
$("wlform").onsubmit = async e => {
  e.preventDefault(); const v = $("wlname").value.trim(); if (!v) return;
  if (await saveWL([...WL, v])) $("wlname").value = "";
};

loadWL(); loadMeta(); load(true); connect();
setInterval(loadMeta, 60000);
</script>
</body>
</html>
